[package]
name = "boss"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "boss"
test = false
bench = false

[dependencies]
bootloader = "0.9"
lazy_static = { version = "1.0", features = ["spin_no_std"] }
spin = "0.5.2"
volatile = "0.2.6"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
